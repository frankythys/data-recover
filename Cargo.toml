[package]
name = "data-recoverer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
egui = "0.29"
rfd = "0.15"
egui-phosphor = "0.7.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_UI_Shell",
]

# `cargo run` bouwt in debug; zonder dit decoderen foto-voorbeelden tientallen
# keren trager. Alleen de afhankelijkheden worden geoptimaliseerd.
[profile.dev.package."*"]
opt-level = 3
